name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: avenova_workspace
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d avenova_workspace"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/avenova_workspace?schema=public
      BETTER_AUTH_SECRET: ci-only-secret-that-is-not-used-outside-tests-123456789
      BETTER_AUTH_URL: http://localhost:3000
      BETTER_AUTH_TRUSTED_ORIGINS: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run db:generate
      - name: Generate initial schema SQL for review
        run: npx prisma migrate diff --from-empty --to-schema-datamodel prisma/schema.prisma --script > initial-schema.sql
      - name: Apply generated schema to ephemeral PostgreSQL
        run: psql "postgresql://postgres:postgres@localhost:5432/avenova_workspace" -v ON_ERROR_STOP=1 -f initial-schema.sql
      - name: Verify critical tenant constraints exist
        run: |
          psql "postgresql://postgres:postgres@localhost:5432/avenova_workspace" -v ON_ERROR_STOP=1 -At -c "SELECT pg_get_constraintdef(oid) FROM pg_constraint WHERE conrelid IN ('\"Lead\"'::regclass, '\"Activity\"'::regclass, '\"Account\"'::regclass) ORDER BY conname" > constraints.txt
          cat constraints.txt
          grep -E 'FOREIGN KEY.*stageId.*organisationId.*REFERENCES.*PipelineStage' constraints.txt
          grep -E 'FOREIGN KEY.*leadId.*organisationId.*REFERENCES.*Lead' constraints.txt
          grep -E 'UNIQUE.*providerId.*accountId' constraints.txt
      - uses: actions/upload-artifact@v4
        with:
          name: generated-initial-schema-sql
          path: initial-schema.sql
          retention-days: 7
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
